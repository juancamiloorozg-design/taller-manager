<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${edicion} ? 'Editar vehículo' : 'Nuevo vehículo', ~{::section})}">
<body>
<section class="caja-form">
    <h1 class="h3 mb-3" th:text="${edicion} ? 'Editar vehículo' : 'Nuevo vehículo'">Nuevo vehículo</h1>

    <form th:action="${edicion} ? @{/vehiculos/{id}(id=${vehiculoId})} : @{/vehiculos}" th:object="${vehiculoForm}"
          method="post" class="card card-body" novalidate>
        <div class="row g-3">
            <div class="col-sm-6">
                <label for="placa" class="form-label">Placa</label>
                <input id="placa" type="text" class="form-control text-uppercase" th:field="*{placa}" maxlength="7"
                       th:classappend="${#fields.hasErrors('placa')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('placa')}" th:errors="*{placa}"></div>
            </div>
            <div class="col-sm-6">
                <label for="clienteId" class="form-label">Propietario</label>
                <select id="clienteId" class="form-select" th:field="*{clienteId}"
                        th:classappend="${#fields.hasErrors('clienteId')} ? 'is-invalid'">
                    <option value="">Selecciona un cliente</option>
                    <option th:each="c : ${clientes}" th:value="${c.id}"
                            th:text="${c.nombre + ' (' + c.numeroDocumento + ')'}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('clienteId')}" th:errors="*{clienteId}"></div>
                <div class="form-text" th:if="${#lists.isEmpty(clientes)}">
                    Primero <a th:href="@{/clientes/nuevo}">registra un cliente</a>.
                </div>
            </div>
            <div class="col-sm-6">
                <label for="marca" class="form-label">Marca</label>
                <input id="marca" type="text" class="form-control" th:field="*{marca}" maxlength="60"
                       th:classappend="${#fields.hasErrors('marca')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}"></div>
            </div>
            <div class="col-sm-6">
                <label for="modelo" class="form-label">Modelo</label>
                <input id="modelo" type="text" class="form-control" th:field="*{modelo}" maxlength="60"
                       th:classappend="${#fields.hasErrors('modelo')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('modelo')}" th:errors="*{modelo}"></div>
            </div>
            <div class="col-sm-6">
                <label for="anio" class="form-label">Año</label>
                <input id="anio" type="number" class="form-control" th:field="*{anio}" min="1950" max="2100"
                       th:classappend="${#fields.hasErrors('anio')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('anio')}" th:errors="*{anio}"></div>
            </div>
            <div class="col-sm-6">
                <label for="color" class="form-label">Color</label>
                <input id="color" type="text" class="form-control" th:field="*{color}" maxlength="30"
                       th:classappend="${#fields.hasErrors('color')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('color')}" th:errors="*{color}"></div>
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary" th:text="${edicion} ? 'Guardar cambios' : 'Registrar vehículo'">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="${edicion} ? @{/vehiculos/{id}(id=${vehiculoId})} : @{/vehiculos}">Cancelar</a>
        </div>
    </form>
</section>
</body>
</html>
