<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Vehículo', ~{::section})}">
<body>
<section>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0"><span class="placa placa-grande" th:text="${vehiculo.placa}"></span> <span th:text="${vehiculo.marca + ' ' + vehiculo.modelo}">Vehículo</span></h1>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-primary" th:href="@{/ordenes/nueva(vehiculoId=${vehiculo.id}, cotizacion=true)}">Nueva cotización</a>
            <a class="btn btn-primary" th:href="@{/ordenes/nueva(vehiculoId=${vehiculo.id})}">Nueva orden</a>
            <a class="btn btn-outline-secondary" th:href="@{/vehiculos/{id}/editar(id=${vehiculo.id})}">Editar</a>
            <form th:action="@{/vehiculos/{id}/eliminar(id=${vehiculo.id})}" method="post" class="m-0"
                  sec:authorize="hasRole('ADMIN')" data-confirm="¿Eliminar este vehículo?">
                <button type="submit" class="btn btn-outline-danger">Eliminar</button>
            </form>
        </div>
    </div>

    <div class="card card-body mb-4">
        <dl class="row mb-0">
            <dt class="col-sm-3">Propietario</dt>
            <dd class="col-sm-9"><a th:href="@{/clientes/{id}(id=${vehiculo.cliente.id})}" th:text="${vehiculo.cliente.nombre}"></a></dd>
            <dt class="col-sm-3">Año</dt>
            <dd class="col-sm-9" th:text="${vehiculo.anio}"></dd>
            <dt class="col-sm-3">Color</dt>
            <dd class="col-sm-9" th:text="${vehiculo.color != null} ? ${vehiculo.color} : '-'"></dd>
        </dl>
    </div>

    <h2 class="h5">Historial de órdenes</h2>
    <div class="table-tarjeta table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead><tr><th>Orden</th><th>Fecha</th><th>Trabajo</th><th>Estado</th><th class="text-end">Total</th><th></th></tr></thead>
            <tbody>
            <tr th:each="o : ${ordenes}">
                <td th:text="'#' + ${o.id}"></td>
                <td th:text="${#temporals.format(o.creadoEn, 'dd/MM/yyyy')}"></td>
                <td th:text="${#strings.abbreviate(o.descripcion, 60)}"></td>
                <td><span class="badge" th:classappend="'text-bg-' + ${o.estado.color}" th:text="${o.estado.etiqueta}"></span></td>
                <td class="text-end" th:text="${@fmt.cop(o.total)}"></td>
                <td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/ordenes/{id}(id=${o.id})}">Ver</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(ordenes)}"><td colspan="6" class="text-center text-muted py-3">Este vehículo todavía no tiene órdenes.</td></tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
