<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Nuevo usuario', ~{::section})}">
<body>
<section class="caja-form">
    <h1 class="h3 mb-3">Nuevo usuario</h1>

    <form th:action="@{/usuarios}" th:object="${usuarioForm}" method="post" class="card card-body" novalidate>
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input id="nombre" type="text" class="form-control" th:field="*{nombre}"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Correo</label>
            <input id="email" type="email" class="form-control" th:field="*{email}" autocomplete="off"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label for="rol" class="form-label">Rol</label>
            <select id="rol" class="form-select" th:field="*{rol}"
                    th:classappend="${#fields.hasErrors('rol')} ? 'is-invalid'">
                <option value="">Selecciona un rol</option>
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r.etiqueta}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Contraseña inicial</label>
            <input id="password" type="password" class="form-control" th:field="*{password}"
                   autocomplete="new-password" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
            <div class="form-text">Mínimo 10 caracteres, con letras y números. La persona puede cambiarla desde "Mi contraseña".</div>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Crear usuario</button>
            <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Cancelar</a>
        </div>
    </form>
</section>
</body>
</html>
