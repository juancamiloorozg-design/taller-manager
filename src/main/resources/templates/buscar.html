<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Buscar', ~{::section})}">
<body>
<section>
    <h1 class="h3 mb-3">Buscar</h1>
    <form th:action="@{/buscar}" method="get" class="d-flex gap-2 mb-4">
        <input type="search" name="q" th:value="${q}" class="form-control" maxlength="60" autofocus
               placeholder="Placa, nombre, documento, teléfono o número de orden" aria-label="Buscar">
        <button type="submit" class="btn btn-primary">Buscar</button>
    </form>

    <p class="text-muted" th:if="${!buscado}">Escribe al menos dos letras o un número de orden.</p>
    <p class="text-muted" th:if="${buscado and !hayResultados}">No encontramos nada con "<span th:text="${q}"></span>".</p>

    <div th:if="${buscado and !#lists.isEmpty(ordenes)}" class="mb-4">
        <h2 class="h5">Orden</h2>
        <div class="table-tarjeta table-responsive"><table class="table table-hover align-middle">
            <tbody><tr th:each="o : ${ordenes}">
                <td><a th:href="@{/ordenes/{id}(id=${o.id})}" th:text="'#' + ${o.id}"></a></td>
                <td><span class="placa" th:text="${o.vehiculo.placa}"></span> <span th:text="${o.vehiculo.cliente.nombre}"></span></td>
                <td><span class="badge" th:classappend="'text-bg-' + ${o.estado.color}" th:text="${o.estado.etiqueta}"></span></td>
                <td class="text-end" th:text="${@fmt.cop(o.total)}"></td>
            </tr></tbody></table></div>
    </div>

    <div th:if="${buscado and !#lists.isEmpty(vehiculos)}" class="mb-4">
        <h2 class="h5">Vehículos</h2>
        <div class="table-tarjeta table-responsive"><table class="table table-hover align-middle">
            <tbody><tr th:each="v : ${vehiculos}">
                <td><a th:href="@{/vehiculos/{id}(id=${v.id})}"><span class="placa" th:text="${v.placa}"></span></a></td>
                <td th:text="${v.marca + ' ' + v.modelo}"></td>
                <td th:text="${v.cliente.nombre}"></td>
            </tr></tbody></table></div>
    </div>

    <div th:if="${buscado and !#lists.isEmpty(clientes)}" class="mb-4">
        <h2 class="h5">Clientes</h2>
        <div class="table-tarjeta table-responsive"><table class="table table-hover align-middle">
            <tbody><tr th:each="c : ${clientes}">
                <td><a th:href="@{/clientes/{id}(id=${c.id})}" th:text="${c.nombre}"></a></td>
                <td th:text="${c.numeroDocumento}"></td>
                <td th:text="${c.telefono}"></td>
            </tr></tbody></table></div>
    </div>
</section>
</body>
</html>
