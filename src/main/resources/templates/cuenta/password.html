<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Cambiar contraseña', ~{::section})}">
<body>
<section class="caja-estrecha">
    <h1 class="h3 mb-3">Cambiar contraseña</h1>

    <form th:action="@{/cuenta/password}" th:object="${passwordForm}" method="post" class="card card-body" novalidate>
        <div class="mb-3">
            <label for="actual" class="form-label">Contraseña actual</label>
            <input id="actual" type="password" class="form-control" th:field="*{actual}"
                   autocomplete="current-password" th:classappend="${#fields.hasErrors('actual')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('actual')}" th:errors="*{actual}"></div>
        </div>
        <div class="mb-3">
            <label for="nueva" class="form-label">Contraseña nueva</label>
            <input id="nueva" type="password" class="form-control" th:field="*{nueva}"
                   autocomplete="new-password" th:classappend="${#fields.hasErrors('nueva')} ? 'is-invalid'">
            <div class="form-text">Mínimo 10 caracteres, con letras y números.</div>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nueva')}" th:errors="*{nueva}"></div>
        </div>
        <div class="mb-3">
            <label for="confirmacion" class="form-label">Repite la contraseña nueva</label>
            <input id="confirmacion" type="password" class="form-control" th:field="*{confirmacion}"
                   autocomplete="new-password" th:classappend="${#fields.hasErrors('confirmacion')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmacion')}" th:errors="*{confirmacion}"></div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/}">Cancelar</a>
        </div>
    </form>
</section>
</body>
</html>
