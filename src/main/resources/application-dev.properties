# Perfil de desarrollo: base H2 en memoria, no hace falta instalar MySQL.
# Los datos se borran cada vez que se detiene la aplicacion.
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:mem:taller;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.thymeleaf.cache=false

# Crea un cliente, un vehiculo y repuestos de ejemplo, y fija una clave de administrador conocida
taller.demo-data=true
taller.admin.email=admin@taller.local
taller.admin.password=Admin12345!
