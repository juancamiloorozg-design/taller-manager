spring.application.name=taller-manager

# ---------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------
server.port=${PORT:8080}
# Necesario cuando la app corre detras de un proxy con HTTPS (Nginx, Caddy, etc.)
server.forward-headers-strategy=framework
server.compression.enabled=true
server.shutdown=graceful

# Sesion y cookies. Pon SESSION_COOKIE_SECURE=true cuando el sitio se sirva por HTTPS.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Nunca mostrar trazas ni mensajes internos al navegador
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# ---------------------------------------------------------------
# Idioma
# ---------------------------------------------------------------
spring.web.locale=es_CO
spring.web.locale-resolver=fixed
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ---------------------------------------------------------------
# Base de datos (MySQL). Las tablas las crea Flyway al arrancar.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taller_manager?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=true

# ---------------------------------------------------------------
# Monitoreo: solo el estado de salud, sin detalles
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------------------------------------------------------------
# Datos del taller. Se muestran en las paginas legales y en la orden impresa.
# Defínelos con variables de entorno antes de publicar el sitio.
# ---------------------------------------------------------------
taller.empresa.nombre=${TALLER_NOMBRE:Taller sin configurar}
taller.empresa.nit=${TALLER_NIT:NIT sin configurar}
taller.empresa.direccion=${TALLER_DIRECCION:Direccion sin configurar}
taller.empresa.ciudad=${TALLER_CIUDAD:Ciudad sin configurar}
taller.empresa.email=${TALLER_EMAIL:correo@sin-configurar.invalid}
taller.empresa.telefono=${TALLER_TELEFONO:Telefono sin configurar}
taller.empresa.cotizacion-dias=${TALLER_COTIZACION_DIAS:8}
taller.empresa.politica-version=2026-11
taller.empresa.politica-fecha=11 de noviembre de 2026

# Administrador inicial. Si ADMIN_PASSWORD no se define, se genera una clave
# aleatoria y se imprime una sola vez en el log del primer arranque.
taller.admin.email=${ADMIN_EMAIL:admin@taller.local}
taller.admin.password=${ADMIN_PASSWORD:}
taller.demo-data=false

# Fotos de la recepcion. En produccion apunta a una carpeta que se respalde (o a un volumen de Docker).
taller.fotos.dir=${TALLER_FOTOS_DIR:datos/fotos}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB

# Respaldos: carpeta, cuantos se conservan y hora diaria (cron de Spring, zona America/Bogota)
taller.respaldos.dir=${TALLER_RESPALDOS_DIR:datos/respaldos}
taller.respaldos.conservar=${TALLER_RESPALDOS_CONSERVAR:14}
taller.respaldos.cron=${TALLER_RESPALDOS_CRON:0 0 2 * * *}
