# Perfil de demostracion publica: base H2 en memoria con datos ficticios.
# Cada pocas horas se borra lo que hayan creado los visitantes y se cargan de nuevo los datos de ejemplo.
# Uso: java -jar taller-manager.jar --spring.profiles.active=demo
spring.datasource.url=jdbc:h2:mem:taller;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

taller.demo-data=true
taller.admin.email=admin@taller.local
taller.admin.password=Admin12345!
taller.demo.activo=true
taller.demo.reinicio-horas=6
taller.demo.mecanico-email=mecanico@taller.local
taller.demo.mecanico-password=Mecanico12345!

taller.fotos.dir=${TALLER_FOTOS_DIR:datos/fotos}
taller.respaldos.dir=${TALLER_RESPALDOS_DIR:datos/respaldos}


# Datos ficticios del taller de la demostracion
taller.empresa.nombre=Taller Mec\u00e1nico Demo
taller.empresa.nit=900.000.000-0
taller.empresa.direccion=Calle 45 # 20-30
taller.empresa.ciudad=Barranquilla
taller.empresa.telefono=605 000 0000
taller.empresa.email=contacto@tallerdemo.example
