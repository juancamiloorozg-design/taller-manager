services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taller_manager
      MYSQL_USER: taller
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en el archivo .env}
      TZ: America/Bogota
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - datos_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/taller_manager?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: taller
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL en el archivo .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en el archivo .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TALLER_NOMBRE: ${TALLER_NOMBRE}
      TALLER_NIT: ${TALLER_NIT}
      TALLER_DIRECCION: ${TALLER_DIRECCION}
      TALLER_CIUDAD: ${TALLER_CIUDAD}
      TALLER_EMAIL: ${TALLER_EMAIL}
      TALLER_TELEFONO: ${TALLER_TELEFONO}
      TALLER_COTIZACION_DIAS: ${TALLER_COTIZACION_DIAS:-8}
      TZ: America/Bogota
    volumes:
      - datos_fotos:/app/datos/fotos
      - datos_respaldos:/app/datos/respaldos

volumes:
  datos_mysql:
  datos_fotos:
  datos_respaldos:
